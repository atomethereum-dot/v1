name: Update DEX price snapshot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dex-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live prices
        run: python3 scripts/fetch_dex_prices.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "sectora-dex-bot"
          git config user.email "actions@github.com"
          git add dex-prices.json
          if git diff --cached --quiet; then
            echo "No price change, nothing to commit."
          else
            git commit -m "Update DEX live price snapshot [skip ci]"
            git push
          fi
